    <script>
      // Apply saved appearance before the first paint, including legacy preferences.
      try {
        const saved = localStorage.getItem("profile-theme");
        const theme =
          saved === "modern" || saved === "dark"
            ? "dark"
            : saved === "retro" || saved === "light"
              ? "light"
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        /* The app still follows system preferences when storage is unavailable. */
      }
    </script>
